  q("Most important reason food handlers must not wear jewelry?",["It looks unprofessional","Jewelry can fall into food or harbor bacteria","It can scratch equipment","Customers may be distracted"],1,"Jewelry can fall into food and also harbors bacteria in its crevices."),
  q("Which is NOT a reason to exclude a food handler?",["Hepatitis A diagnosis","Norovirus illness","Common cold with mild sneezing","Vomiting within the last 24 hours"],2,"A common cold with mild sneezing is not a reason for full exclusion, though good hygiene is vital."),
  q("Food handler touches their hair while preparing food. They should:",["Continue if wearing a hat","Wash their hands immediately","Wipe hands on apron and continue","Apply hand sanitizer only"],1,"Touching hair contaminates hands. Immediate handwashing is required."),
  q("Handwashing must occur after:",["Putting on gloves","Using restroom, handling raw meat, touching face, before handling food","Handling packaged goods only","Completing each full task"],1,"Handwashing is required after all these activities."),
  q("What should manager do if food handler reports having Hepatitis A?",["Let them continue if wearing gloves","Exclude them and notify the local health authority","Restrict them to dishwashing","Ask them to return when they feel better"],1,"Hepatitis A is a reportable illness. The worker must be excluded and health authority notified."),
  q("How should hair be managed in a food preparation area?",["Loose hair is fine if short","Restrained with a hairnet, hat, or appropriate covering","Only long hair needs to be restrained","Covered only when working with raw meat"],1,"All hair must be properly restrained in a food preparation area."),
  q("Difference between cleaning and sanitizing?",["They are the same thing","Cleaning removes dirt; sanitizing reduces pathogens to safe levels","Sanitizing removes dirt; cleaning kills bacteria","Cleaning kills bacteria; sanitizing removes odors"],1,"Cleaning removes physical dirt; sanitizing reduces bacteria to safe levels."),
  q("Example of a non-food contact surface?",["Cutting board","Kitchen floor","Mixing bowl","Cooking utensil"],1,"The kitchen floor is a non-food contact surface."),
  q("Correct procedure for cleaning and sanitizing a prep table between uses?",["Wipe with a wet cloth","Scrape, wash with detergent, rinse, sanitize, and air dry","Apply sanitizer spray only","Rinse with hot water"],1,"The full procedure: scrape debris, wash, rinse, sanitize, air dry."),
  q("When must food contact surfaces be cleaned and sanitized?",["Only when visibly dirty","After each use and every 4 hours during continuous use","Once per shift","Only after handling allergens"],1,"Food contact surfaces must be cleaned after each use and minimum every 4 hours."),
  q("What type of cleaner removes rust and mineral deposits?",["Alkaline detergent","Acid cleaner","Abrasive cleaner","Neutral cleaner"],1,"Acid cleaners are formulated to remove rust and mineral deposits."),
  q("Correct water temperature for sanitize compartment using chemical sanitizer?",["At least 55F","At least 75F","At least 100F","At least 120F"],1,"The sanitizing solution temperature must be at least 75F for most chemical sanitizers."),
  q("Best cleaning agent for removing grease from cooking equipment?",["Acid cleaner","Abrasive powder","Degreasing alkaline cleaner","Neutral cleaner"],2,"Alkaline degreasers break down grease and fat effectively."),
  q("What must be done before equipment is returned to service after cleaning?",["Inspected for cleanliness","Cleaned, sanitized, and fully air dried","Replaced yearly","Approved by management"],1,"Equipment must go through the full clean-sanitize-air dry process."),
  q("How should test strips be used in a food service operation?",["To test food temperature","To verify sanitizer concentration","To test water quality for drinking","To check if food is fully cooked"],1,"Test strips verify that sanitizer is at the correct concentration."),
  q("Best way to maintain sanitizer effectiveness throughout a shift?",["Change solution regularly and test concentration frequently","Use maximum concentration to last longer","Add more chemical as shift goes on","Use room temperature water"],0,"Changing the solution regularly and testing concentration ensures effectiveness."),
  q("Correct action if dishwasher is not reaching required rinse temperature?",["Run dishes through twice","Take out of service and use 3-compartment sink","Lower the temperature requirement","Add extra chemical sanitizer"],1,"If the dishwasher is not reaching proper temperatures, use the 3-compartment sink."),
  q("Pest most commonly associated with foodborne illness through droppings and urine?",["Cockroaches","Mice and rats","Flies","Ants"],1,"Rodents spread dangerous pathogens through droppings, urine, and contact."),
  q("FIRST thing a manager should do when discovering a severe pest infestation?",["Set more traps","Close the establishment if necessary and call a licensed PCO","Spray pesticide themselves","Increase cleaning frequency only"],1,"A severe infestation may require temporarily closing and must involve a licensed PCO."),
  q("Common entry point for pests?",["Smooth concrete walls","Tight-fitting door seals","Gaps around utility pipes and drains","Walk-in freezer doors"],2,"Gaps around utility pipes and drains are common pest entry points."),
  q("What does an effective pest prevention program include?",["Pesticide use only","Inspection, sanitation, structural maintenance, and working with a PCO","Traps only","Calling PCO only when pests are seen"],1,"An effective program combines inspection, sanitation, maintenance, and professional pest control."),
  q("How to reduce risk of a fly infestation?",["Keep windows open for airflow","Ensure garbage is covered and stored away from building, and fix drainage issues","Use fly strips everywhere","Use pesticide spray daily"],1,"Covered garbage, proper drainage, and sealed entry points are the best fly prevention measures."),
  q("What type of pest leaves a greasy trail along walls and floors?",["Flies","Cockroaches","Stored product pests","Ants"],1,"Cockroaches leave greasy smear marks along walls and floors as they travel."),
  q("Why rotate food stock regularly?",["To reduce costs","To prevent pests from nesting in undisturbed food packages","To improve flavor","To meet FIFO requirements only"],1,"Regular stock rotation disturbs potential pest nesting areas."),
  q("Sign of a fruit fly infestation?",["Large droppings near food","Small flies hovering around drains, produce, and garbage areas","Gnaw marks on packaging","Feathers or nesting material"],1,"Fruit flies swarm around fermenting produce, wet garbage, and drains."),
  q("Role proper lighting plays in pest control?",["Makes pests more visible for inspection","Attracts fewer pests when yellow lighting is used","Eliminates all pests","Has no role in pest control"],0,"Good lighting helps staff spot pest evidence, and yellow lighting near entries attracts fewer insects."),
  q("New shipment of flour contains grain weevils. What to do?",["Use it before it gets worse","Reject or destroy the entire shipment","Sift out the weevils and use the rest","Freeze for 24 hours to kill pests"],1,"Any food infested with pests must be rejected or destroyed."),
  q("Structural fix that best reduces cockroach harborage?",["Adding more storage shelves","Sealing cracks in walls and floors","Improving ventilation","Installing brighter lights"],1,"Sealing cracks eliminates the dark, warm hiding places cockroaches need."),
  q("A delivery driver drops off frozen shrimp with solid ice fused to the bottom of the box. The package still reads frozen. What should you do?",["Accept it since it is still frozen","Reject it, since the ice indicates it thawed and was refrozen","Accept it and use it first","Refreeze it harder before storing"],1,"Solid ice buildup at the bottom of packaging is a thaw-and-refreeze sign, grounds for rejection."),
  q("You open a dry storage room and find flour clumping and cardboard boxes going soft at the bottom. What is the most likely cause?",["The food is expired","Excess humidity in the storage room","The lighting is too bright","Not enough FIFO rotation"],1,"Humidity above the ideal 50-60% range causes clumping and softens packaging."),
  q("A walk-in cooler's wall thermometer reads 38F, but food near the door feels warm. What is the most likely explanation?",["The thermometer is wrong and should be ignored","Blocked airflow is creating a warm pocket that the single reading doesn't catch","The food was recently delivered and hasn't cooled yet","This is normal and does not need attention"],1,"A single thermometer reading only reflects its own location; blocked airflow can leave other spots warmer."),
  q("A case of canned beans has a few cans with rust and a small pinhole leak. What should happen?",["Use the cans that appear least damaged","Reject the damaged cans","Wipe them down and store as normal","Use them only for well-cooked dishes"],1,"Rusted or leaking cans compromise the seal and must be rejected."),
  q("A new batch of chicken salad is made Thursday and placed in front of Monday's batch on the shelf. What is wrong with this?",["Nothing, newer food should go first","This violates FIFO; the newer batch should go behind the older one","Chicken salad doesn't need rotation","This is only a problem if both are past date"],1,"FIFO requires new stock to go behind older stock so the oldest is used first."),
  q("A supplier shows up with a delivery but has no invoice, temperature log, or business paperwork, offering a lower price. What should you do?",["Accept it since it's cheaper","Decline; no paperwork means no chain of custody for the food's safety","Accept but log it as unverified","Ask them to come back later with paperwork after you've accepted the food"],1,"No paperwork means no verifiable chain of custody. Decline regardless of price."),
  q("Ground beef is delivered at 46F instead of the required 41F or below. What should happen?",["Accept it and refrigerate immediately","Reject the delivery","Accept it but cook it the same day","Accept it and freeze it instead"],1,"Cold TCS food failing its receiving temperature check must be rejected, no exceptions."),
  q("A prep cook stacks boxes of dry goods directly on the floor of the storage room. What is the concern?",["It looks untidy","It blocks air circulation, invites pests, and prevents cleaning underneath","It voids the manufacturer's warranty","There is no real concern as long as it's dry"],1,"Food on the floor blocks airflow, invites pests, and can't be properly cleaned around."),
  q("Milk arrives at 44F. Is this acceptable, and what must happen next?",["Not acceptable, reject it","Acceptable at receipt, but it must be cooled to 41F within 4 hours","Acceptable permanently at 44F","Only acceptable if it will be used immediately"],1,"Milk may be received up to 45F, but must reach 41F within 4 hours of receiving."),
  q("A cooler shelf has raw poultry stored above a container of ready-to-eat coleslaw. What is the risk?",["None, as long as both are covered","Poultry juices could drip down and contaminate the coleslaw, which gets no further cooking","The coleslaw will absorb odor only","This is the correct order"],1,"Poultry must always be on the bottom shelf so drips cannot reach food that receives no further cooking."),
  q("Boxes of canned goods are stored on a shelf with only 3 inches of clearance from the floor. What is the concern?",["3 inches is enough clearance","Food should be at least 6 inches off the floor for airflow, cleaning, and pest inspection","Cans don't need floor clearance","This only matters for perishable food"],1,"The 6-inch rule applies to all stored food, including canned and dry goods."),
  q("A kitchen wants to start curing its own bacon in-house. What must happen before they can start?",["Nothing extra, it's just a recipe change","They must obtain a variance from the regulatory authority and submit a written HACCP plan","They only need a new supplier for the pork","They need to hire a butcher"],1,"Curing is a variance trigger requiring regulatory approval and a written HACCP plan."),
  q("The power goes out for 20 minutes during dinner service. What is the correct response?",["Ignore it since it was brief","Assess affected food, keep doors closed, and notify the regulatory authority if TCS food exceeds safe time/temperature limits","Wait until closing to check anything","Throw out all food in the building immediately, even unaffected items"],1,"Even a brief outage requires assessing affected food and notifying the authority if limits are exceeded."),
  q("A soup line's HACCP plan requires checking temperature every 2 hours during hot holding. At the 2-hour mark, the soup reads 125F. What should happen?",["Continue holding since it's close to 135F","Determine how long it's been below 135F, then reheat to 165F if under 4 cumulative hours or discard if the time can't be determined","Add more hot water to the pot","Ignore it since the next check isn't due yet"],1,"Corrective action means determining time below the limit, then reheating or discarding accordingly."),
  q("An inspector finds a sanitizer bucket testing at 0 ppm chlorine during a routine visit. What classification does this likely receive?",["A priority item requiring immediate correction","A cosmetic note with no required action","An imminent health hazard requiring closure","A core item with a 90-day correction window"],0,"A failed sanitizer concentration is a priority item, requiring fast, often immediate, correction."),
  q("A customer calls to report symptoms consistent with foodborne illness after eating at your restaurant the night before. What should the PIC do first?",["Tell them it's not possible since no one else complained","Gather details, preserve any suspect food, and log the complaint in writing","Immediately discard all food from that shift to be safe","Refuse to discuss it without a lawyer present"],1,"The correct response starts with gathering details, preserving suspect food, and logging the complaint."),
  q("A restaurant wants to serve acidified sushi rice held at room temperature. What determines whether this requires a HACCP variance?",["The price of the menu item","Whether the process is being used to render the food no longer TCS","The size of the restaurant","Whether sushi is a popular menu item"],1,"Using additives or acidification to remove TCS status is a specific variance trigger."),
  q("During an inspection, sewage is found backing up into a prep sink. What happens to that operation?",["It continues with a note in the inspection report","It must stop immediately and cannot reopen until the regulatory authority approves","Only the sink itself is closed off with tape","Nothing, since it's a plumbing issue, not food safety"],1,"A sewage backup is an imminent health hazard requiring an immediate stop and regulatory approval to reopen."),
  q("A chicken is cooked to 165F, a clear CCP. Which of the following would NOT typically be considered a CCP in the same process?",["Cooking the chicken","Hot holding the cooked chicken","Receiving the raw chicken","Reheating leftover chicken"],2,"Receiving is typically a control point, not a CCP, since a later cooking step can still correct it."),
  q("A manager notices the same critical limit failure happening repeatedly on the same piece of equipment. According to HACCP principles, what is missing?",["Nothing, occasional failures are expected and require no action","A proper corrective action addressing the root cause, not just fixing each batch","A bigger piece of equipment","Better-tasting food"],1,"Repeated failures signal that the root cause hasn't been addressed by the corrective action."),
  q("A restaurant is planning to keep a tank of live lobsters for display and sale. What is required?",["Nothing beyond a regular tank","A HACCP variance for operating a molluscan/crustacean shellfish life-support display tank","Just a bigger fish license","A different type of lobster"],1,"Operating a shellfish life-support display tank is a specific variance trigger."),
  q("An employee is diagnosed with Shigella. What must the manager do?",["Nothing unless the employee shows symptoms at work","Notify the local health authority, since Shigella is one of the Big 5 reportable pathogens","Wait to see if coworkers get sick first","Only document it internally"],1,"Shigella is one of the Big 5 pathogens requiring mandatory reporting to the health authority."),
  q("A bakery's floor mixer sits flush against the tile with no legs and no seal. Months later, an inspection finds a mouse nest behind it. What was the underlying facility failure?",["The mixer was too loud","No clearance or seal meant the gap couldn't be cleaned or inspected, creating pest habitat","The mixer was the wrong color","The mixer used too much electricity"],1,"Without clearance or a seal, the inaccessible gap became undisturbed pest habitat."),
  q("A short-staffed kitchen has cooks rinsing vegetables and dumping mop water in the only sink within reach of the line, which happens to be the handwashing sink. What is the problem?",["There is no problem if the sink is rinsed after","Multi-purpose use turns the handwashing sink into a contamination source instead of a hygiene tool","This is fine as long as hot water is used","Only mop water use is a violation, not vegetable rinsing"],1,"Any non-handwashing use turns the sink into a contamination source rather than a hygiene tool."),
  q("A porter leaves a hose submerged in a bucket of sanitizer while stepping away, and a nearby pressure drop reverses water flow. What just happened?",["Nothing of concern, the hose was clean","A backflow event that could pull diluted sanitizer back into the building's drinking water pipes","The sanitizer bucket overflowed harmlessly","This only affects the mop sink, not other fixtures"],1,"This is a backflow event, which can pull contamination into the building's drinking water pipes."),
  q("A prep table with a meat slicer is lit at 30 foot-candles. What is the concern?",["No concern; 30 fc is above the requirement","It's below the 50 foot-candle minimum required for areas where blades are used, risking both food and employee safety","Lighting requirements only apply to walk-ins","30 fc is only a problem at night"],1,"30 foot-candles falls short of the 50 fc minimum required around bladed equipment."),
  q("An older kitchen has a sharp 90-degree corner where the floor meets the wall, and grease keeps building up there no matter how often it's mopped. What facility feature would solve this?",["A stronger cleaning chemical","Coving, which replaces the sharp corner with a rounded, sealed transition","A taller baseboard","Better lighting in that corner"],1,"Coving eliminates the sharp corner where a mop can't reach, replacing it with a cleanable curve."),
  q("A roadside diner uses well water that has never been tested, though it looks and tastes normal. What is the concern?",["None, since the water looks and tastes fine","Potability can't be judged by taste or smell; the well should be properly tested","Well water is always unsafe and must be replaced with bottled water","This only matters if customers complain"],1,"Potability can't be judged by taste or smell; private wells must be properly tested."),
  q("Outdoor garbage containers are missing lids and sit directly against the back door, overflowing after a busy weekend. What risk does this create?",["Only an odor issue","It attracts pests and gives them a short path directly into the building","No risk as long as it's emptied by Monday","This only matters in summer"],1,"Uncovered, overflowing garbage near an entrance attracts pests and gives them easy building access."),
  q("An inspector finds an exhaust hood with months of grease buildup on the filters, causing vapor to drift sideways across the cook line instead of venting up. What two risks does this create?",["Noise and odor only","Surface contamination from settling grease film, and a fire hazard from accumulated grease","Only a fire hazard, no contamination risk","Only a contamination risk, no fire hazard"],1,"Grease buildup creates both a surface-contamination risk and a serious fire hazard."),
  q("A cook stores acidic tomato sauce overnight in a galvanized steel pan instead of stainless steel. What happens?",["Nothing; galvanized metal is fine for all foods","The acid reacts with the zinc coating and can leach metal into the sauce","The pan will rust immediately","The sauce will taste better"],1,"Acidic food reacts with galvanized metal's zinc coating, leaching metal into the food."),
  q("A walk-in cooler's evaporator lacks a working condensate drain pan, and water drips from the ceiling onto open cases of deli meat below. What is the correct fix?",["Cover the deli meat and continue as normal","Repair the condensate drain and ensure no overhead moisture source can contact food","Move the deli meat to a warmer location","This is not a food safety issue"],1,"The condensate drain must be repaired so overhead moisture cannot contact food."),
  q("A manager notices daylight visible under an exterior door. What pest risk does this specifically indicate?",["No risk; light doesn't affect pests","A gap large enough for a mouse to enter, since even a quarter-inch gap is enough","Only flying insects can exploit this gap","This is a fire code issue, not a pest issue"],1,"Visible daylight under a door means a gap large enough for a mouse to squeeze through.")

  q("MOST important factor in preventing foodborne illness?",["Using expensive equipment","Temperature control and proper handwashing","Buying premium ingredients","Working quickly"],1,"Temperature control and proper handwashing are the foundation of prevention."),

  q("Condition most likely to lead to a foodborne illness outbreak?",["Using stainless steel equipment","Cooling a large pot of stew at room temperature overnight","Refrigerating leftover cooked rice","Cooking chicken to 165F"],1,"Cooling a large pot at room temperature creates ideal conditions for dangerous bacterial growth."),
  q("Main danger of cross-contact in relation to food allergens?",["It changes the food flavor","A person with an allergy can have a severe or fatal reaction","It affects food texture","It changes cooking requirements"],1,"Allergen cross-contact can cause severe allergic reactions including anaphylaxis."),
  q("Example of proper food labeling practice?",["Using initials for food type","Including the food name and use-by date on all stored prepared food","Labeling only refrigerated items","No labels needed if food is used same day"],1,"All stored prepared food must be labeled with the food name and use-by date."),

  q("Which is NOT one of the Big 6 pathogens?",["Norovirus","Salmonella Typhi","Hepatitis B","Shiga toxin-producing E. coli"],2,"Hepatitis B is not in the Big 6. Hepatitis A is."),
  q("Food handler drops a knife on the floor. What to do?",["Pick it up and wipe with a towel","Pick it up and run under water","Clean and sanitize it before using again","Replace with a new knife"],2,"The knife must be cleaned and sanitized before being returned to use."),
  q("Key principle of HACCP?",["Clean and sanitize everything daily","Identify and control hazards at critical control points","Use approved suppliers only","Train all staff in food safety"],1,"HACCP focuses on identifying and controlling hazards at critical points."),
  q("A roast beef is measured at 140F after resting. Is it safe?",["Yes, 140F is above 135F","No, whole roasts must reach 145F","Yes, all beef just needs 135F","No, beef requires 165F"],1,"Whole roasts must reach a minimum of 145F with a 3-minute rest time."),
  q("How long can cold food be held without temperature control before discard?",["2 hours","4 hours","6 hours","8 hours"],1,"Cold food without temperature control can be held for a maximum of 4 hours."),
  q("Method of temperature measurement that gives the fastest reading?",["Bimetallic stemmed thermometer","Thermocouple","Infrared","Candy thermometer"],1,"Thermocouples provide the fastest temperature readings."),
  q("Food in steam table drops below 135F. Maximum time before discard?",["1 hour","2 hours","4 hours total in danger zone","6 hours"],2,"Food should not accumulate more than 4 hours total in the danger zone."),
  q("What does it mean to calibrate a thermometer?",["Clean and sanitize it","Adjust it to ensure it reads accurately","Replace the battery","Buy a new one"],1,"Calibration ensures the thermometer reads accurate temperatures."),
  q("Which food has the highest minimum cooking temperature?",["Whole pork roast","Ground chicken","Intact beef steak","Shrimp"],1,"Ground poultry requires 165F."),
  q("Purpose of resting meat after cooking?",["Improve appearance","Allow juices to redistribute and ensure uniform temperature throughout","Cool the meat faster","Reduce shrinkage"],1,"Resting allows carryover heat to distribute evenly."),
  q("When checking temperature of a large pot of soup, where to place thermometer?",["Near the surface","At the bottom","In the center of the food mass","On the side"],2,"Temperature should be checked in the center, the coolest point in a large container."),
  q("Which food is safe to serve rare or medium-rare?",["Ground beef burger","Intact beef steak","Chicken breast","Ground turkey"],1,"An intact beef steak can be served below 155F because its surface is seared."),
  q("What is the 2-hour/4-hour rule?",["Discard after 2 hours; safe for 4 hours total","If in danger zone 0-2 hrs: safe; 2-4 hrs: use immediately; over 4 hrs: discard","Check temperature every 2 hours and discard after 4 checks","Reheat every 2 hours; discard after 4 reheatings"],1,"The 2/4-hour rule guides decisions about food safety based on cumulative time in the danger zone."),
  q("Minimum internal temperature for cooking rabbit?",["135F","145F","155F","165F"],3,"Rabbit is classified with poultry and must reach 165F."),
  q("When should bare-hand contact with ready-to-eat food be avoided?",["Only when cooking","At all times. Use utensils or gloves","Only with high-risk populations","Only with raw food"],1,"Bare-hand contact with ready-to-eat food should always be avoided."),
  q("Proper handwashing technique after using the restroom?",["Rinse with water only","Use hand sanitizer only","Wash with soap and water for 20 seconds, rinse, dry with paper towel","Quick soap and rinse is sufficient"],2,"A full 20-second handwash with soap and water is required."),
  q("Food handler tells manager they were diagnosed with Shigella. What should manager do?",["Let them work as normal","Exclude them from the operation and report to the health authority","Restrict them to non-food tasks","Have them wear double gloves"],1,"Shigella is a Big 6 pathogen requiring exclusion and notification of the health authority."),
  q("How should clean uniforms be stored?",["In the food prep area","In a clean location away from soiled laundry and food","In the employee locker near the kitchen","Anywhere convenient"],1,"Clean uniforms must be stored in a clean location separate from soiled clothing and food."),
  q("Which behavior increases the risk of contaminating food?",["Washing hands before prep","Wearing a hairnet","Tasting food with the same spoon repeatedly","Using clean gloves"],2,"Tasting food with the same spoon multiple times transfers pathogens into the food."),
  q("Which symptom requires restriction (not exclusion)?",["Vomiting","Diarrhea","Sore throat with fever in operation serving general public","Hepatitis A diagnosis"],2,"A sore throat with fever requires restriction unless serving high-risk populations."),
  q("Which is NOT a proper handwashing step?",["Wetting hands under running water","Applying soap","Scrubbing for at least 20 seconds","Using a shared cloth towel to dry"],3,"Always dry with a paper towel or air dryer. Shared cloth towels spread bacteria."),
  q("Why is it important for food handlers to report illness?",["To get time off work","To prevent the spread of illness to customers through food","To meet legal requirements only","To get medical treatment faster"],1,"Reporting illness allows managers to prevent potentially sick workers from handling food."),
  q("What should food handler do at start of each shift?",["Begin working immediately","Check their health, wash hands, and put on clean attire","Put on gloves first","Eat before starting to avoid hunger on shift"],1,"At the start of each shift, a food handler should assess their health, wash hands, and wear clean attire."),
  q("Which activity requires handwashing between steps?",["Moving from cutting tomatoes to slicing bread","Moving from washing dishes to serving food","Both of the above","Neither. Gloves eliminate this need"],2,"Both transitions carry contamination risk and require handwashing between steps."),
  q("How should food handler behave if they observe a food safety violation?",["Ignore it if not their responsibility","Report it to a manager immediately","Correct it themselves without telling anyone","Wait to see if it causes a problem"],1,"Food safety violations must be reported to a manager immediately."),
  q("Item requiring most frequent cleaning and sanitizing?",["Storage shelves","Food contact surfaces used continuously","Walk-in refrigerator walls","Dining room chairs"],1,"Food contact surfaces in continuous use must be cleaned and sanitized at least every 4 hours."),
  q("Correct concentration for chlorine sanitizer in 3-compartment sink?",["10-20 ppm","25-50 ppm","50-100 ppm","200 ppm"],2,"Chlorine sanitizer for immersion sanitizing should be 50-100 ppm."),
  q("Which action correctly describes clean as you go?",["Cleaning entire kitchen at end of shift","Cleaning and sanitizing surfaces immediately after each use","Wiping counters every hour","Mopping floor between meals"],1,"Cleaning as you go means addressing messes and sanitizing surfaces immediately after use."),
  q("How long must chemical sanitizer contact a food-contact surface to be effective?",["5 seconds","30 seconds","1 minute","5 minutes"],1,"Most chemical sanitizers require at least 30 seconds of contact time."),
  q("Why must cleaning cloths be stored in sanitizer solution when not in use?",["To keep them moist","To prevent bacterial growth on the cloth","To save on laundry costs","To soften the cloth"],1,"Storing cloths in sanitizer prevents bacteria from multiplying on the cloth."),
  q("Which type of contamination results from failing to properly clean a knife between uses?",["Physical contamination","Chemical contamination","Biological contamination (cross-contamination)","Radiological contamination"],2,"A dirty knife can spread biological contaminants from one food to another."),
  q("Purpose of the rinse step in 3-compartment sink?",["Kill remaining bacteria","Remove detergent and food residue before sanitizing","Apply sanitizer more effectively","Cool the items"],1,"Rinsing removes soap and residue so the sanitizer can make proper contact."),
  q("Which cleaning tool should NOT be used on food contact surfaces?",["Brush","Cloth dampened with sanitizer","Steel wool","Sponge"],2,"Steel wool sheds fibers that can physically contaminate food and scratches surfaces."),
  q("How should drain covers be maintained?",["Replaced annually","Cleaned regularly to prevent organic buildup and pest breeding","Left alone as they self-clean","Removed for ventilation"],1,"Drain covers must be cleaned regularly to prevent organic buildup."),
  q("Which factor makes a surface harder to clean and sanitize?",["Smooth stainless steel","Scratches, cracks, or porous material","Bright lighting","Proper ventilation"],1,"Scratches and porous materials harbor bacteria that are difficult to remove."),
  q("What to do with single-use food containers after use?",["Wash and reuse if clean-looking","Sanitize and reuse for dry storage","Discard immediately","Return to supplier"],2,"Single-use containers must always be discarded after their first use."),
  q("MOST effective long-term approach to pest management?",["Maximum pesticide use","Integrated Pest Management combining prevention, monitoring, and control","Relying on traps only","Calling PCO only when pests are found"],1,"IPM combining prevention, monitoring, sanitation, and targeted control is the most effective approach."),
  q("What action if pests are found in food during delivery?",["Remove pests and accept delivery","Reject the entire delivery","Accept if only small portion is affected","Cook food immediately to kill pests"],1,"Any delivery found to contain pests must be rejected entirely."),

function buildSyncPayload() {
  const examsTaken=S.examHistory.length;
  const passed=S.examHistory.filter(e=>e.pct>=75).length;
  const avg=examsTaken?Math.round(S.examHistory.reduce((s,e)=>s+e.pct,0)/examsTaken):0;
  const best=examsTaken?Math.max(...S.examHistory.map(e=>e.pct)):0;
  const versionBests={};
  ["v1","v2","v3","v4","v5"].forEach(ver=>{const h=S.examHistory.filter(e=>e.version===ver);if(h.length)versionBests[ver]=Math.max(...h.map(e=>e.pct));});
  return {
    examHistory:S.examHistory,savedGuides:S.savedGuides,techDone:S.techDone,topicDone:S.topicDone,
    stats:{examsTaken,examsPassed:passed,averageScore:avg,bestScore:best,lastUpdated:new Date().toISOString()},
    versionBests,eggPin:"1997",
    hockeyStats:["The Red Wings have 11 Stanley Cups. The Flyers are still waiting for their second.","Detroit swept the Flyers 4-0 in the 1997 Stanley Cup Finals. The Eagles went 6-9-1 that year.","Steve Yzerman captained Detroit for 20 seasons.","Nicklas Lidstrom won the Norris Trophy 7 times.","The Red Wings won the Cup in 1997, 1998, 2002, and 2008.","Gordie Howe played in five different decades.","The Red Wings retired 9 jersey numbers.","Dominik Hasek won back-to-back Hart Trophies in 1997 and 1998.","A hockey puck travels at 108 mph. That is faster than most Eagles comebacks.","The Red Wings franchise was founded in 1926, seven years before the Eagles.","In 1997 the Eagles finished 6-9-1. The Wings won the Stanley Cup. Just saying.","The Stanley Cup weighs 34.5 pounds. Detroit has lifted it 11 times.","Brendan Shanahan scored 656 career goals and won three Stanley Cups.","The octopus tradition started in 1952 — eight arms for eight playoff wins.","Patrick Roy won the Conn Smythe Trophy three times.","Steve Yzerman finally lifted the Cup in 1997 after 13 years as captain.","The 1998 Red Wings carried Konstantinov onto the ice in a wheelchair to celebrate.","Hockey players lose 5-8 pounds per game from effort.","Joe Louis Arena was one of the loudest buildings in sports history.","Eleven Cups. Four decades of dominance. Detroit hockey is legendary.","The real ServSafe exam is 90 questions. You have practiced every one. You are ready.","Passing ServSafe requires 75 percent. Your practice tests show you can do better.","Remember: the PIN is four digits from a year that matters. Think about the clues.","Green is a beautiful color. Detroit just uses red better. Fly Eagles Fly.","The Stanley Cup is 35 inches tall. Detroit has lifted it 11 times.","Mario Lemieux scored 5 goals 5 different ways in one game.","Zero Eagles fans have ever out-argued a Red Wings fan about hockey. Different sport.","The lockout exists because you need to think harder about that PIN. You know it.","Sergei Fedorov won the Hart Trophy in 1994, the last Red Wing to win league MVP.","The Cup has been used as a cereal bowl, a baptismal font, and left roadside once.","Fun fact: this app was built with love and appreciation for the Detroit Red Wings.","You got this. Four digits. A year that matters. Think about the clues. Go study."]
  };
}

async function saveToCloud() {
  const payload = buildSyncPayload();
  const payloadStr = JSON.stringify(payload);
  if (payloadStr === lastSyncedData) return; // nothing changed
  try {
    const resp = await fetch(JSONBIN.baseUrl + "/" + JSONBIN.binId, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": JSONBIN.masterKey,
        "X-Access-Key": JSONBIN.accessKey
      },
      body: payloadStr
    });
    if (!resp.ok) throw new Error("Save failed: " + resp.status);
    lastSyncedData = payloadStr;
    console.log("Saved to cloud ✓");
    const el=document.getElementById("syncStatus");
    if(el){el.textContent=eggSyncMessage("☁️ Synced just now");setTimeout(()=>{if(el)el.textContent="";},3000);}
  } catch(e) {
    console.warn("Cloud save failed, data kept locally:", e.message);
  }
}

// Debounced save — waits 1.5s after last change before syncing
function scheduleSave() {
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(saveToCloud, 1500);
}

  EGG.logoTapCount++;

async function submitFeedback(){
  const msgEl=document.getElementById("fbMessage");
  if(msgEl) S.fb.message=msgEl.value.trim();
  if(!S.fb.message){S.fb.error="Please write a message before sending!";r(false);return;}
  S.fb.sending=true;S.fb.error="";r(false);

  // Build stats snapshot to include in email
  const examsTaken=S.examHistory.length;
  const topicsDone=ssTopics.filter(t=>S.topicDone[t.id]).length;
  const bestScore=examsTaken?Math.max(...S.examHistory.map(e=>e.pct))+"%":"None yet";
  const currentScreen=S.screen;

  const templateParams={
    feedback_type: S.fb.type||"(not specified)",
    mood_rating: S.fb.mood>0?["😕 Frustrated","😐 Meh","🙂 Pretty Good","😄 Happy","🤩 Love it!"][S.fb.mood-1]:"(not rated)",
    topics_affected: S.fb.tags.length?S.fb.tags.join(", "):"(none selected)",
    message: S.fb.message,
    app_stats: "Topics completed: "+topicsDone+"/5 | Exams taken: "+examsTaken+" | Best score: "+bestScore,
    sent_at: new Date().toLocaleString()
  };

  try{
    await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, templateParams);
    S.fb={type:"",mood:0,tags:[],message:"",sending:false,sent:true,error:""};
  }catch(e){
    S.fb.sending=false;
    S.fb.error="Hmm, something went wrong sending the email. Check your connection and try again! ("+e.text+")";
  }
  r(false);
}

function pinGetClue(){
  const w = S.pin.wrongCount;
  if(w === 0) return PIN_CLUES[0]; // first visit
  const idx = Math.min(w, PIN_CLUES.length - 1);
  return PIN_CLUES[idx];
}

function pinStartLockout(){
  S.pin.locked = true;
  S.pin.lockSecondsLeft = 15;
  // Pick random stats, no repeats in this batch
  const pool = (S.hockeyStats && S.hockeyStats.length ? S.hockeyStats : [
    "🏒 Gordie Howe played in 5 different decades.", "🏆 Detroit has won 11 Stanley Cups.", "🎯 Steve Yzerman captained Detroit for 20 seasons."
  ]).slice().sort(()=>Math.random()-0.5);
  S.pin.lockStats = pool.slice(0, 6);
  S.pin.statIdx = 0;
  r(false);
  // Rotate stat every 3 seconds
  S.pin.statInterval = setInterval(()=>{
    S.pin.statIdx = (S.pin.statIdx + 1) % S.pin.lockStats.length;
    r(false);
  }, 3000);
  // Count down seconds
  S.pin.lockCountdown = setInterval(()=>{
    S.pin.lockSecondsLeft--;
    if(S.pin.lockSecondsLeft <= 0){
      clearInterval(S.pin.statInterval);
      clearInterval(S.pin.lockCountdown);
      S.pin.locked = false;
      S.pin.entry = "";
      S.pin.error = "";
      r(false);
    } else {
      r(false);
    }
  }, 1000);
}

let _synth=window.speechSynthesis||null;
function speak(text){
  if(!_synth)return;
  stopSpeech();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.92;u.pitch=1.05;
  _synth.speak(u);
}
function stopSpeech(){if(_synth)_synth.cancel();}

  +(isLast?"":"<button style='flex:2;padding:14px;border-radius:15px;background:linear-gradient(135deg,"+l.light+","+l.accent+");color:#fff;font-size:16px;font-weight:bold;border:none;font-family:Georgia,serif;cursor:pointer' data-action='techNext'>Next →</button>")
  +"</div>"
  +"</div>";
}

// ═══════════════════════════════════════════
// AI HOW-TO GUIDE BUILDER
// ═══════════════════════════════════════════
async function submitAI(){
  const inp=document.getElementById("aiInput");
  if(inp)S.aiRequest=inp.value.trim();
  if(!S.aiRequest){return;}
  S.aiLoading=true;S.aiError=false;S.aiLesson=null;r(false);
  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user",content:"Create a friendly step-by-step how-to guide for: "+S.aiRequest+"\n\nRespond in JSON only, no markdown, no preamble. Format: {\"title\":\"...\",\"steps\":[{\"num\":1,\"title\":\"...\",\"text\":\"...\",\"tip\":\"...\"}]} with 4-7 steps. Keep language simple and encouraging for older adults."}]
      })
    });
    const data=await resp.json();
    const txt=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    const clean=txt.replace(/```json|```/g,"").trim();
    const parsed=JSON.parse(clean);
    S.aiLesson=parsed;S.aiStep=0;S.aiComplete=false;
    S.aiLoading=false;
    S.savedGuides.push({title:parsed.title,steps:parsed.steps,date:new Date().toLocaleDateString()});
    if(S.savedGuides.length>20)S.savedGuides=S.savedGuides.slice(0,20);
    saveGuides();
    S.screen="aiLesson";r();
  }catch(e){
    S.aiLoading=false;S.aiError=true;r(false);
  }
}
function renderAskAI(){
  const guides=S.savedGuides.slice().reverse().slice(0,3);
  const gl=guides.length?"<div class='sec-label' style='margin-top:16px'>📚 Recent Guides</div>"+guides.map((g,i)=>"<button class='home-card' style='border-left-color:#004C54' data-action='openSavedGuide' data-i='"+i+"'><span style='font-size:28px'>📄</span><div style='flex:1'><div style='font-size:14px;font-weight:bold;color:#222'>"+escHtml(g.title)+"</div><div style='font-size:12px;color:#999'>"+g.date+" · "+g.steps.length+" steps</div></div><span style='font-size:16px;color:#aaa'>›</span></button>").join(""):"";
  return"<div class='wrap'>"
  +"<div class='top-bar'><button class='home-btn' data-action='goHome'>← Home</button>"
  +"<div><div style='font-size:15px;font-weight:bold;color:#fff'>🤖 Build a How-To Guide</div>"
  +"<div style='font-size:12px;color:rgba(255,255,255,0.7);margin-top:1px'>Ask me anything!</div></div></div>"
  +"<div class='card'>"
  +"<p style='font-size:14px;color:#555;line-height:1.7;margin:0 0 13px'>Type what you need help with and I will make a simple step-by-step guide just for you! For example: <em>How do I video call my daughter?</em></p>"
  +(S.aiError?"<div style='background:#FFEBEE;border-radius:11px;padding:12px;color:#C62828;font-size:13px;margin-bottom:10px'>⚠️ Oops! Something went wrong. Check your connection and try again.</div>":"")
  +(S.aiLoading?"<div class='ai-thinking'><div class='dot'></div><div class='dot'></div><div class='dot'></div></div><p style='color:#fff;font-size:13px;text-align:center;margin-top:6px'>Building your guide...</p>":"<textarea id='aiInput' placeholder='What do you need help with? (e.g. How do I print from my computer?)' rows='4' style='width:100%;border:2px solid #ddd;border-radius:12px;padding:13px 14px;font-size:15px;font-family:Lora,Georgia,serif;resize:none;outline:none;line-height:1.6;color:#222;transition:border-color 0.2s'>"+escHtml(S.aiRequest)+"</textarea><button class='big-btn' style='background:linear-gradient(135deg,#c4a35a,#004C54);margin-top:10px' data-action='submitAI'>🤖 Build My Guide!</button>")
  +"</div>"
  +gl
  +"</div>";
}
function renderAILesson(){
  if(!S.aiLesson)return renderAskAI();
  const lesson=S.aiLesson,step=lesson.steps[S.aiStep],isLast=S.aiStep+1>=lesson.steps.length,pct=Math.round((S.aiStep/lesson.steps.length)*100);
  return"<div class='wrap'>"
  +"<div class='top-bar'><button class='home-btn' style='background:#004C54' data-action='goAskAI'>← Back</button>"
  +"<div><div style='font-size:14px;font-weight:bold;color:#fff'>📖 "+escHtml(lesson.title)+"</div>"
  +"<div style='font-size:12px;color:rgba(255,255,255,0.7);margin-top:1px'>Step "+(S.aiStep+1)+" of "+lesson.steps.length+"</div></div></div>"
  +"<div class='prog-wrap'><div class='prog-bar' style='width:"+pct+"%;background:linear-gradient(90deg,#c4a35a,#004C54)'></div></div>"
  +"<div class='ai-bubble'>"+escHtml(step.text)+"</div>"
  +(step.tip?"<div style='background:rgba(255,255,255,0.12);border-radius:12px;padding:11px 14px;margin-bottom:12px;border-left:4px solid #c4a35a'><p style='color:#fff;font-size:13px;line-height:1.7;margin:0'>💡 "+escHtml(step.tip)+"</p></div>":"")
  +(isLast&&S.aiComplete?"<div style='background:linear-gradient(135deg,#004C54,#002f35);border-radius:16px;padding:20px;text-align:center;margin-bottom:12px'><div style='font-size:48px'>🎉</div><h2 style='color:#fff;font-family:Oswald,sans-serif;font-size:20px;margin:8px 0'>Guide Complete!</h2><p style='color:rgba(255,255,255,0.85);font-size:14px;margin:0'>Great job following along! 💛 Fly Eagles Fly!</p></div>":"")
  +"<div style='display:flex;gap:9px'>"
  +"<button style='flex:1;padding:14px;border-radius:15px;background:"+(S.aiStep===0?"#e0e0e0":"#f5f5f5")+";color:"+(S.aiStep===0?"#bbb":"#555")+";font-size:14px;font-weight:bold;border:none;font-family:Georgia,serif;cursor:"+(S.aiStep===0?"not-allowed":"pointer")+"' data-action='aiBack'"+(S.aiStep===0?" disabled":"")+">← Back</button>"
  +"<button style='flex:2;padding:14px;border-radius:15px;background:linear-gradient(135deg,#c4a35a,#004C54);color:#fff;font-size:16px;font-weight:bold;border:none;font-family:Georgia,serif;cursor:pointer' data-action='aiNext'>"+(isLast?"🎉 Done!":"Next Step →")+"</button>"
  +"</div>"
  +"</div>";
}


// ═══════════════════════════════════════════
// EVENT BINDING
// ═══════════════════════════════════════════
function bindEvents(){
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click",()=>{
      const a=el.dataset.action;
      if(a==="goHome"){S.screen="home";stopSpeech();r();}
      else if(a==="goAskAI"){S.aiRequest="";S.aiLesson=null;S.aiError=false;S.aiLoading=false;S.screen="askAI";r();}
      else if(a==="submitAI"){submitAI();}
      else if(a==="openTech"){const l=techLessons.find(x=>x.id===el.dataset.id);if(l){S.lesson=l;S.step=0;S.screen="techLesson";r();}}
      else if(a==="techNext"){if(S.step+1<S.lesson.steps.length){S.step++;r();}}
      else if(a==="techBack"){if(S.step>0){S.step--;r();}}
      else if(a==="techDone"){S.techDone[S.lesson.id]=true;scheduleSave();S.screen="home";r();}
      else if(a==="openSavedGuide"){const idx=parseInt(el.dataset.i);const g=S.savedGuides.slice().reverse()[idx];if(g){S.aiLesson=g;S.aiStep=0;S.aiComplete=false;S.screen="aiLesson";r();}}
      else if(a==="aiNext"){if(S.aiStep+1>=S.aiLesson.steps.length){S.aiComplete=true;r(false);}else{S.aiStep++;r();}}
      else if(a==="aiBack"){if(S.aiStep>0){S.aiStep--;r(false);}}
      else if(a==="goServSafe"){S.screen="servsafe";r();}
      else if(a==="goSelectExam"){S.screen="selectExam";r();}
      else if(a==="goSelectShortExam"){S.screen="selectShortExam";r();}
      else if(a==="goReports"){S.screen="reports";r();}
      else if(a==="openLinks"){S.screen="links";r();}
      else if(a==="clearHistory"){if(confirm("Clear all exam history? This cannot be undone.")){S.examHistory=[];saveHist();r();}}
      else if(a==="resetAllProgress"){if(confirm("Reset ALL progress? This will wipe exam history AND all completed topics. Cannot be undone.")){S.examHistory=[];S.topicDone={};saveHist();r();}}
      else if(a==="openTopic"){const t=ssTopics.find(x=>x.id===el.dataset.id);S.topic=t;S.lessonPage=0;S.quizIdx=0;S.quizSel=null;S.quizAnswers=[];S.screen="servsafeLesson";stopSpeech();r();}
      else if(a==="lessonNext"){if(S.lessonPage+1>=S.topic.lesson.length){S.screen="quiz";S.quizIdx=0;S.quizSel=null;S.quizAnswers=[];stopSpeech();r();}else{stopSpeech();S.lessonPage++;r();}}
      else if(a==="lessonBack"){if(S.lessonPage>0){stopSpeech();S.lessonPage--;r();}}
      else if(a==="readLesson"){speak(S.topic.lesson[S.lessonPage].t);}
      else if(a==="selectQuiz"){if(S.quizSel===null){S.quizSel=parseInt(el.dataset.i);r(false);}}
      else if(a==="quizNext"){const newA=[...S.quizAnswers,S.quizSel];if(S.quizIdx+1>=S.topic.questions.length){S.quizAnswers=newA;const sc=newA.filter((a,i)=>a===S.topic.questions[i].ans).length;if(sc/S.topic.questions.length>=0.6){S.topicDone[S.topic.id]=true;}scheduleSave();S.screen="quizResult";r();}else{S.quizAnswers=newA;S.quizIdx++;S.quizSel=null;r();}}
      else if(a==="retryQuiz"){S.quizIdx=0;S.quizSel=null;S.quizAnswers=[];S.screen="quiz";r();}
      else if(a==="reviewLesson"){S.lessonPage=0;S.screen="servsafeLesson";r();}
      else if(a==="startExam"){
        S.examVersion=el.dataset.ver;
        S.examType=el.dataset.type||"full";
        S.examQs=buildExam(S.examVersion,S.examType);
        S.examIdx=0;S.examSel=null;S.examAnswers=[];
        S.screen="practiceExam";stopSpeech();r();
      }
      else if(a==="selectExam"){if(S.examSel===null){S.examSel=parseInt(el.dataset.i);const q=S.examQs[S.examIdx];const isWrong=S.examSel!==q.ans;S.eggTaunt=isWrong?eggWrongAnswerTaunt():null;if(isWrong)eggMaybeFlashWingsLogo();r(false);}}
      else if(a==="tapLogo"){eggHandleLogoTap();}
      else if(a==="examNext"){const newA=[...S.examAnswers,S.examSel];S.eggTaunt=null;if(S.examIdx+1>=S.examQs.length){S.examAnswers=newA;S.screen="examResult";saveHist();r();}else{S.examAnswers=newA;S.examIdx++;S.examSel=null;r();}}
      else if(a==="retryExam"){
        S.examQs=buildExam(S.examVersion,S.examType);
        S.examIdx=0;S.examSel=null;S.examAnswers=[];
        S.screen="practiceExam";r();
      }
      else if(a==="goFeedback"){S.fb={type:"",mood:0,tags:[],message:"",sending:false,sent:false,error:""};S.screen="feedback";r();}
      else if(a==="goPin"){
        // Clear any running timers from previous visit
        if(S.pin.statInterval) clearInterval(S.pin.statInterval);
        if(S.pin.lockCountdown) clearInterval(S.pin.lockCountdown);
        S.pin={entry:"",error:"",wrongCount:S.pin.wrongCount||0,locked:false,lockTimer:null,lockSecondsLeft:0,statIdx:0,statInterval:null,lockCountdown:null,lockStats:[]};
        S.screen="pin";r();
      }
      else if(a==="goEggList"){S.screen="eggList";r();}
      else if(a==="pinKey"){
        if(S.pin.locked) return;
        const v=el.dataset.val;
        if(v==="⌫"){S.pin.entry=S.pin.entry.slice(0,-1);S.pin.error="";}
        else if(S.pin.entry.length<4){S.pin.entry+=v;}
        // Auto-submit when 4 digits entered
        if(S.pin.entry.length===4){
          if(S.pin.entry===S.cloudPin){
            // 🎉 CORRECT!
            if(S.pin.statInterval) clearInterval(S.pin.statInterval);
            if(S.pin.lockCountdown) clearInterval(S.pin.lockCountdown);
            S.pin.wrongCount=0;
            S.screen="pinVictory";r();
          } else {
            // ❌ Wrong
            S.pin.wrongCount++;
            S.pin.entry="";
            const nextLockAt = Math.ceil(S.pin.wrongCount/5)*5;
            const untilLock = nextLockAt - S.pin.wrongCount;
            if(S.pin.wrongCount % 5 === 0){
              // Trigger lockout
              S.pin.error="";
              pinStartLockout();
            } else {
              S.pin.error="Wrong PIN. "+untilLock+" attempt"+(untilLock!==1?"s":"")+" before lockout. 🔒";
            }
          }
        }
        r(false);
      }
      else if(a==="fbMood"){S.fb.mood=parseInt(el.dataset.i);r(false);}
      else if(a==="fbType"){S.fb.type=el.dataset.val;r(false);}
      else if(a==="fbTag"){const v=el.dataset.val;const idx=S.fb.tags.indexOf(v);if(idx>-1)S.fb.tags.splice(idx,1);else S.fb.tags.push(v);r(false);}
      else if(a==="fbSend"){submitFeedback();}
    });
  });

  // Live char count for feedback textarea
  const fbMsg=document.getElementById("fbMessage");
  const fbCount=document.getElementById("fbCharCount");
  if(fbMsg&&fbCount){
    fbMsg.addEventListener("input",()=>{
      S.fb.message=fbMsg.value;
      fbCount.textContent=fbMsg.value.length+" characters";
      // update send button state live
      const btn=document.querySelector("[data-action='fbSend']");
      if(btn){
        const ok=fbMsg.value.trim().length>=3;
        btn.style.background=ok?"linear-gradient(135deg,#c4a35a,#004C54)":"#ccc";
        btn.style.cursor=ok?"pointer":"not-allowed";
        btn.disabled=!ok;
      }
    });
  }

}
