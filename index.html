async function saveToCloud() {
  const payload = buildSyncPayload();
  const payloadStr = JSON.stringify(payload);
  if (payloadStr === lastSyncedData) return; // nothing changed
  try {
    const resp = await fetch(JSONBIN.baseUrl + "/" + JSONBIN.binId, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": JSONBIN.masterKey,
        "X-Access-Key": JSONBIN.accessKey
      },
      body: payloadStr
    });
    if (!resp.ok) throw new Error("Save failed: " + resp.status);
    lastSyncedData = payloadStr;
    console.log("Saved to cloud ✓");
    const el=document.getElementById("syncStatus");
    if(el){el.textContent=eggSyncMessage("☁️ Synced just now");setTimeout(()=>{if(el)el.textContent="";},3000);}
  } catch(e) {
    console.warn("Cloud save failed, data kept locally:", e.message);
  }
}

// Debounced save — waits 1.5s after last change before syncing
function scheduleSave() {
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(saveToCloud, 1500);
}

function buildExam(ver, type){

  if(type === "short") {
    const selected = [];
    for(let t=0;t<5;t++){

function renderExamResult(){
  const total=S.examQs.length,score=S.examAnswers.filter((a,i)=>a===S.examQs[i].ans).length,pct=Math.round((score/total)*100),pass=pct>=75;
  const bd=TOPICS.map((name,ti)=>{const idxs=S.examQs.map((q,i)=>q.topicIdx===ti?i:-1).filter(i=>i>=0);const correct=idxs.filter(i=>S.examAnswers[i]===S.examQs[i].ans).length;const tot=idxs.length;const tp=tot>0?Math.round((correct/tot)*100):0;return{name,correct,tot,tp};});
  const typeLabel=S.examType==="short"?"Quick Practice":"Version "+S.examVersion.replace("v","");
  S.examHistory.unshift({version:S.examVersion,examType:S.examType,score,total,pct,date:new Date().toLocaleDateString(),topicBreakdown:bd});
  if(S.examHistory.length>50)S.examHistory=S.examHistory.slice(0,50);saveHist();
  const rows=S.examQs.map((q,i)=>"<div class='result-row' style='color:"+(S.examAnswers[i]===q.ans?"#2E7D32":"#C62828")+"'><span>"+(S.examAnswers[i]===q.ans?"✓":"✗")+"</span><span style='flex:1'>"+q.q+"</span></div>").join("");
  const bdH=bd.filter(b=>b.tot>0).map(b=>{const c=b.tp>=75?"#2E7D32":b.tp>=50?"#F57F17":"#C62828";return"<div style='margin-bottom:9px'><div style='display:flex;justify-content:space-between;font-size:13px;color:#333;margin-bottom:2px'><span>"+b.name+"</span><span style='font-weight:bold;color:"+c+"'>"+b.tp+"% ("+b.correct+"/"+b.tot+")</span></div><div class='rbar-wrap'><div class='rbar' style='width:"+b.tp+"%;background:"+c+"'></div></div></div>";}).join("");
  const retryAction=S.examType==="short"?"goSelectShortExam":"goSelectExam";
  const egg71=eggCheck71(pct);
  const egg75=eggBarely75(pct);

  return"<div class='wrap'><div style='text-align:center;padding-top:12px;margin-bottom:14px'><div style='font-size:56px;margin-bottom:8px'>"+(pass?"🏆":"💪")+"</div><h1 style='font-size:22px;color:#fff;margin-bottom:5px'>"+(pass?"You Would Pass the Real Exam!":"Keep Going — You Are Getting There!")+"</h1><div style='font-size:13px;color:rgba(255,255,255,0.8)'>"+typeLabel+" · "+new Date().toLocaleDateString()+"</div></div><div class='card'><div style='text-align:center;margin-bottom:14px'><div style='font-size:44px;font-weight:bold;color:"+(pass?"#2E7D32":"#c4a35a")+"'>"+score+"/"+total+"</div><div style='font-size:17px;color:#666;margin-top:2px'>"+pct+"% correct · Passing is 75%</div><div style='margin-top:9px;padding:9px 13px;border-radius:11px;background:"+(pass?"#E8EAF6":"#FFF3E0")+";font-size:13px;color:#555;line-height:1.6'>"+(pass?"Wonderful! You scored above 75%. Consider trying another version to stay sharp. Let's Go Rangers! 🏒":"You scored "+pct+"%. Review the topics below with lower scores and try again. You have totally got this!")+"</div></div><div style='margin-bottom:12px'><div style='font-size:13px;font-weight:bold;color:#333;margin-bottom:9px'>Topic Breakdown:</div>"+bdH+"</div><details><summary style='font-size:13px;font-weight:bold;color:#555;cursor:pointer;padding:7px 0'>All Questions (tap to expand)</summary><div style='margin-top:9px'>"+rows+"</div></details></div>"+egg71+egg75+egg100+"<button class='big-btn' style='background:linear-gradient(135deg,#c4a35a,#004C54)' data-action='retryExam'>🔁 Retake This Version</button><button class='big-btn' style='background:linear-gradient(135deg,#004C54,#002f35)' data-action='"+retryAction+"'>📝 Try a Different Version</button><button class='big-btn' style='background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.4)' data-action='goHome'>🏠 Home</button></div>";

async function submitFeedback(){
  const msgEl=document.getElementById("fbMessage");
  if(msgEl) S.fb.message=msgEl.value.trim();
  if(!S.fb.message){S.fb.error="Please write a message before sending!";r(false);return;}
  S.fb.sending=true;S.fb.error="";r(false);

  // Build stats snapshot to include in email
  const examsTaken=S.examHistory.length;
  const topicsDone=ssTopics.filter(t=>S.topicDone[t.id]).length;
  const bestScore=examsTaken?Math.max(...S.examHistory.map(e=>e.pct))+"%":"None yet";
  const currentScreen=S.screen;

  const templateParams={
    feedback_type: S.fb.type||"(not specified)",
    mood_rating: S.fb.mood>0?["😕 Frustrated","😐 Meh","🙂 Pretty Good","😄 Happy","🤩 Love it!"][S.fb.mood-1]:"(not rated)",
    topics_affected: S.fb.tags.length?S.fb.tags.join(", "):"(none selected)",
    message: S.fb.message,
    app_stats: "Topics completed: "+topicsDone+"/5 | Exams taken: "+examsTaken+" | Best score: "+bestScore,
    sent_at: new Date().toLocaleString()
  };

  try{
    await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, templateParams);
    S.fb={type:"",mood:0,tags:[],message:"",sending:false,sent:true,error:""};
  }catch(e){
    S.fb.sending=false;
    S.fb.error="Hmm, something went wrong sending the email. Check your connection and try again! ("+e.text+")";
  }
  r(false);
}

function pinGetClue(){
  const w = S.pin.wrongCount;
  if(w === 0) return PIN_CLUES[0]; // first visit
  const idx = Math.min(w, PIN_CLUES.length - 1);
  return PIN_CLUES[idx];
}

function pinStartLockout(){
  S.pin.locked = true;
  S.pin.lockSecondsLeft = 15;
  // Pick random stats, no repeats in this batch
  const pool = (S.hockeyStats && S.hockeyStats.length ? S.hockeyStats : [
    "🏒 Gordie Howe played in 5 different decades.", "🏆 Detroit has won 11 Stanley Cups.", "🎯 Steve Yzerman captained Detroit for 20 seasons."
  ]).slice().sort(()=>Math.random()-0.5);
  S.pin.lockStats = pool.slice(0, 6);
  S.pin.statIdx = 0;
  r(false);
  // Rotate stat every 3 seconds
  S.pin.statInterval = setInterval(()=>{
    S.pin.statIdx = (S.pin.statIdx + 1) % S.pin.lockStats.length;
    r(false);
  }, 3000);
  // Count down seconds
  S.pin.lockCountdown = setInterval(()=>{
    S.pin.lockSecondsLeft--;
    if(S.pin.lockSecondsLeft <= 0){
      clearInterval(S.pin.statInterval);
      clearInterval(S.pin.lockCountdown);
      S.pin.locked = false;
      S.pin.entry = "";
      S.pin.error = "";
      r(false);
    } else {
      r(false);
    }
  }, 1000);
}

// ═══════════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════════
function escHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ═══════════════════════════════════════════
// SPEECH
// ═══════════════════════════════════════════
let _synth=window.speechSynthesis||null;
function speak(text){
  if(!_synth)return;
  stopSpeech();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.92;u.pitch=1.05;
  _synth.speak(u);
}
function stopSpeech(){if(_synth)_synth.cancel();}

// ═══════════════════════════════════════════
// AI HOW-TO GUIDE BUILDER
// ═══════════════════════════════════════════
async function submitAI(){
  const inp=document.getElementById("aiInput");
  if(inp)S.aiRequest=inp.value.trim();
  if(!S.aiRequest){return;}
  S.aiLoading=true;S.aiError=false;S.aiLesson=null;r(false);
  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user",content:"Create a friendly step-by-step how-to guide for: "+S.aiRequest+"\n\nRespond in JSON only, no markdown, no preamble. Format: {\"title\":\"...\",\"steps\":[{\"num\":1,\"title\":\"...\",\"text\":\"...\",\"tip\":\"...\"}]} with 4-7 steps. Keep language simple and encouraging for older adults."}]
      })
    });
    const data=await resp.json();
    const txt=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    const clean=txt.replace(/```json|```/g,"").trim();
    const parsed=JSON.parse(clean);
    S.aiLesson=parsed;S.aiStep=0;S.aiComplete=false;
    S.aiLoading=false;
    S.savedGuides.push({title:parsed.title,steps:parsed.steps,date:new Date().toLocaleDateString()});
    if(S.savedGuides.length>20)S.savedGuides=S.savedGuides.slice(0,20);
    saveGuides();
    S.screen="aiLesson";r();
  }catch(e){
    S.aiLoading=false;S.aiError=true;r(false);
  }
}

  const guides=S.savedGuides.slice().reverse().slice(0,3);
  const gl=guides.length?"<div class='sec-label' style='margin-top:16px'>📚 Recent Guides</div>"+guides.map((g,i)=>"<button class='home-card' style='border-left-color:#004C54' data-action='openSavedGuide' data-i='"+i+"'><span style='font-size:28px'>📄</span><div style='flex:1'><div style='font-size:14px;font-weight:bold;color:#222'>"+escHtml(g.title)+"</div><div style='font-size:12px;color:#999'>"+g.date+" · "+g.steps.length+" steps</div></div><span style='font-size:16px;color:#aaa'>›</span></button>").join(""):"";
  return"<div class='wrap'>"
  +"<div class='top-bar'><button class='home-btn' data-action='goHome'>← Home</button>"
  +"<div><div style='font-size:15px;font-weight:bold;color:#fff'>🤖 Build a How-To Guide</div>"
  +"<div style='font-size:12px;color:rgba(255,255,255,0.7);margin-top:1px'>Ask me anything!</div></div></div>"
  +"<div class='card'>"
  +"<p style='font-size:14px;color:#555;line-height:1.7;margin:0 0 13px'>Type what you need help with and I will make a simple step-by-step guide just for you! For example: <em>How do I video call my daughter?</em></p>"
  +(S.aiError?"<div style='background:#FFEBEE;border-radius:11px;padding:12px;color:#C62828;font-size:13px;margin-bottom:10px'>⚠️ Oops! Something went wrong. Check your connection and try again.</div>":"")
  +(S.aiLoading?"<div class='ai-thinking'><div class='dot'></div><div class='dot'></div><div class='dot'></div></div><p style='color:#fff;font-size:13px;text-align:center;margin-top:6px'>Building your guide...</p>":"<textarea id='aiInput' placeholder='What do you need help with? (e.g. How do I print from my computer?)' rows='4' style='width:100%;border:2px solid #ddd;border-radius:12px;padding:13px 14px;font-size:15px;font-family:Lora,Georgia,serif;resize:none;outline:none;line-height:1.6;color:#222;transition:border-color 0.2s'>"+escHtml(S.aiRequest)+"</textarea><button class='big-btn' style='background:linear-gradient(135deg,#c4a35a,#004C54);margin-top:10px' data-action='submitAI'>🤖 Build My Guide!</button>")
  +"</div>"
  +gl
  +"</div>";
}
function renderAILesson(){
  if(!S.aiLesson)return renderAskAI();
  const lesson=S.aiLesson,step=lesson.steps[S.aiStep],isLast=S.aiStep+1>=lesson.steps.length,pct=Math.round((S.aiStep/lesson.steps.length)*100);
  return"<div class='wrap'>"

  +(isLast&&S.aiComplete?"<div style='background:linear-gradient(135deg,#004C54,#002f35);border-radius:16px;padding:20px;text-align:center;margin-bottom:12px'><div style='font-size:48px'>🎉</div><h2 style='color:#fff;font-family:Oswald,sans-serif;font-size:20px;margin:8px 0'>Guide Complete!</h2><p style='color:rgba(255,255,255,0.85);font-size:14px;margin:0'>Great job following along! 💛 Fly Eagles Fly!</p></div>":"")
  +"<div style='display:flex;gap:9px'>"
  +"<button style='flex:1;padding:14px;border-radius:15px;background:"+(S.aiStep===0?"#e0e0e0":"#f5f5f5")+";color:"+(S.aiStep===0?"#bbb":"#555")+";font-size:14px;font-weight:bold;border:none;font-family:Georgia,serif;cursor:"+(S.aiStep===0?"not-allowed":"pointer")+"' data-action='aiBack'"+(S.aiStep===0?" disabled":"")+">← Back</button>"
  +"<button style='flex:2;padding:14px;border-radius:15px;background:linear-gradient(135deg,#c4a35a,#004C54);color:#fff;font-size:16px;font-weight:bold;border:none;font-family:Georgia,serif;cursor:pointer' data-action='aiNext'>"+(isLast?"🎉 Done!":"Next Step →")+"</button>"

// ═══════════════════════════════════════════
// EVENT BINDING
// ═══════════════════════════════════════════
function bindEvents(){
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click",()=>{
      const a=el.dataset.action;
      if(a==="goHome"){S.screen="home";stopSpeech();r();}
      else if(a==="goAskAI"){S.aiRequest="";S.aiLesson=null;S.aiError=false;S.aiLoading=false;S.screen="askAI";r();}
      else if(a==="submitAI"){submitAI();}
      else if(a==="openTech"){const l=techLessons.find(x=>x.id===el.dataset.id);if(l){S.lesson=l;S.step=0;S.screen="techLesson";r();}}
      else if(a==="techNext"){if(S.step+1<S.lesson.steps.length){S.step++;r();}}
      else if(a==="techBack"){if(S.step>0){S.step--;r();}}
      else if(a==="techDone"){S.techDone[S.lesson.id]=true;scheduleSave();S.screen="home";r();}
      else if(a==="openSavedGuide"){const idx=parseInt(el.dataset.i);const g=S.savedGuides.slice().reverse()[idx];if(g){S.aiLesson=g;S.aiStep=0;S.aiComplete=false;S.screen="aiLesson";r();}}
      else if(a==="aiNext"){if(S.aiStep+1>=S.aiLesson.steps.length){S.aiComplete=true;r(false);}else{S.aiStep++;r();}}
      else if(a==="aiBack"){if(S.aiStep>0){S.aiStep--;r(false);}}
      else if(a==="goServSafe"){S.screen="servsafe";r();}
      else if(a==="goSelectExam"){S.screen="selectExam";r();}
      else if(a==="goSelectShortExam"){S.screen="selectShortExam";r();}
      else if(a==="goReports"){S.screen="reports";r();}
      else if(a==="openLinks"){S.screen="links";r();}
      else if(a==="clearHistory"){if(confirm("Clear all exam history? This cannot be undone.")){S.examHistory=[];saveHist();r();}}
      else if(a==="resetAllProgress"){if(confirm("Reset ALL progress? This will wipe exam history AND all completed topics. Cannot be undone.")){S.examHistory=[];S.topicDone={};saveHist();r();}}
      else if(a==="openTopic"){const t=ssTopics.find(x=>x.id===el.dataset.id);S.topic=t;S.lessonPage=0;S.quizIdx=0;S.quizSel=null;S.quizAnswers=[];S.screen="servsafeLesson";stopSpeech();r();}
      else if(a==="lessonNext"){if(S.lessonPage+1>=S.topic.lesson.length){S.screen="quiz";S.quizIdx=0;S.quizSel=null;S.quizAnswers=[];stopSpeech();r();}else{stopSpeech();S.lessonPage++;r();}}
      else if(a==="lessonBack"){if(S.lessonPage>0){stopSpeech();S.lessonPage--;r();}}
      else if(a==="readLesson"){speak(S.topic.lesson[S.lessonPage].t);}
      else if(a==="selectQuiz"){if(S.quizSel===null){S.quizSel=parseInt(el.dataset.i);r(false);}}
      else if(a==="quizNext"){const newA=[...S.quizAnswers,S.quizSel];if(S.quizIdx+1>=S.topic.questions.length){S.quizAnswers=newA;const sc=newA.filter((a,i)=>a===S.topic.questions[i].ans).length;if(sc/S.topic.questions.length>=0.6){S.topicDone[S.topic.id]=true;}scheduleSave();S.screen="quizResult";r();}else{S.quizAnswers=newA;S.quizIdx++;S.quizSel=null;r();}}
      else if(a==="retryQuiz"){S.quizIdx=0;S.quizSel=null;S.quizAnswers=[];S.screen="quiz";r();}
      else if(a==="reviewLesson"){S.lessonPage=0;S.screen="servsafeLesson";r();}
      else if(a==="startExam"){
        S.examVersion=el.dataset.ver;
        S.examType=el.dataset.type||"full";
        S.examQs=buildExam(S.examVersion,S.examType);
        S.examIdx=0;S.examSel=null;S.examAnswers=[];
        S.screen="practiceExam";stopSpeech();r();
      }
      else if(a==="selectExam"){if(S.examSel===null){S.examSel=parseInt(el.dataset.i);const q=S.examQs[S.examIdx];const isWrong=S.examSel!==q.ans;S.eggTaunt=isWrong?eggWrongAnswerTaunt():null;if(isWrong)eggMaybeFlashWingsLogo();r(false);}}
      else if(a==="tapLogo"){eggHandleLogoTap();}
      else if(a==="examNext"){const newA=[...S.examAnswers,S.examSel];S.eggTaunt=null;if(S.examIdx+1>=S.examQs.length){S.examAnswers=newA;S.screen="examResult";saveHist();r();}else{S.examAnswers=newA;S.examIdx++;S.examSel=null;r();}}
      else if(a==="retryExam"){
        S.examQs=buildExam(S.examVersion,S.examType);
        S.examIdx=0;S.examSel=null;S.examAnswers=[];
        S.screen="practiceExam";r();
      }
      else if(a==="goFeedback"){S.fb={type:"",mood:0,tags:[],message:"",sending:false,sent:false,error:""};S.screen="feedback";r();}
      else if(a==="goPin"){
        // Clear any running timers from previous visit
        if(S.pin.statInterval) clearInterval(S.pin.statInterval);
        if(S.pin.lockCountdown) clearInterval(S.pin.lockCountdown);
        S.pin={entry:"",error:"",wrongCount:S.pin.wrongCount||0,locked:false,lockTimer:null,lockSecondsLeft:0,statIdx:0,statInterval:null,lockCountdown:null,lockStats:[]};
        S.screen="pin";r();
      }
      else if(a==="goEggList"){S.screen="eggList";r();}
      else if(a==="pinKey"){
        if(S.pin.locked) return;
        const v=el.dataset.val;
        if(v==="⌫"){S.pin.entry=S.pin.entry.slice(0,-1);S.pin.error="";}
        else if(S.pin.entry.length<4){S.pin.entry+=v;}
        // Auto-submit when 4 digits entered
        if(S.pin.entry.length===4){
          if(S.pin.entry===S.cloudPin){
            // 🎉 CORRECT!
            if(S.pin.statInterval) clearInterval(S.pin.statInterval);
            if(S.pin.lockCountdown) clearInterval(S.pin.lockCountdown);
            S.pin.wrongCount=0;
            S.screen="pinVictory";r();
          } else {
            // ❌ Wrong
            S.pin.wrongCount++;
            S.pin.entry="";
            const nextLockAt = Math.ceil(S.pin.wrongCount/5)*5;
            const untilLock = nextLockAt - S.pin.wrongCount;
            if(S.pin.wrongCount % 5 === 0){
              // Trigger lockout
              S.pin.error="";
              pinStartLockout();
            } else {
              S.pin.error="Wrong PIN. "+untilLock+" attempt"+(untilLock!==1?"s":"")+" before lockout. 🔒";
            }
          }
        }
        r(false);
      }
      else if(a==="fbMood"){S.fb.mood=parseInt(el.dataset.i);r(false);}
      else if(a==="fbType"){S.fb.type=el.dataset.val;r(false);}
      else if(a==="fbTag"){const v=el.dataset.val;const idx=S.fb.tags.indexOf(v);if(idx>-1)S.fb.tags.splice(idx,1);else S.fb.tags.push(v);r(false);}
      else if(a==="fbSend"){submitFeedback();}
    });
  });

  // Live char count for feedback textarea
  const fbMsg=document.getElementById("fbMessage");
  const fbCount=document.getElementById("fbCharCount");
  if(fbMsg&&fbCount){
    fbMsg.addEventListener("input",()=>{
      S.fb.message=fbMsg.value;
      fbCount.textContent=fbMsg.value.length+" characters";
      // update send button state live
      const btn=document.querySelector("[data-action='fbSend']");
      if(btn){
        const ok=fbMsg.value.trim().length>=3;
        btn.style.background=ok?"linear-gradient(135deg,#c4a35a,#004C54)":"#ccc";
        btn.style.cursor=ok?"pointer":"not-allowed";
        btn.disabled=!ok;
      }
    });
  }

}
